<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{today}} Hacker News 摘要</title>
<style>
  body { max-width: 760px; margin: 52px auto; padding: 0 26px; font: 17px/1.8 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #26313b; background: #fdfcfa; }
  header { border-bottom: 1px solid #ece6dc; padding-bottom: 18px; margin-bottom: 26px; }
  .kicker { margin: 0; color: #c2560f; font-size: 14px; letter-spacing: .08em; }
  h1 { font-size: 30px; line-height: 1.3; margin: 6px 0 0; }
  h2 { font-size: 20px; margin: 36px 0 12px; padding-left: 10px; border-left: 4px solid #c2560f; }
  .highlights { background: #fff3e8; border-radius: 12px; padding: 14px 22px; }
  .highlights h2 { margin-top: 0; border: 0; padding: 0; }
  .highlights ol { margin: 0; padding-left: 22px; }
  .item { background: #fff; border: 1px solid #ece6dc; border-radius: 12px; padding: 14px 18px; margin: 10px 0; }
  .item h3 { font-size: 17px; margin: 0 0 4px; line-height: 1.5; }
  .item h3 a { color: #1f2a33; text-decoration: none; }
  .item h3 a:hover { color: #c2560f; text-decoration: underline; }
  .item .meta { color: #857c70; font-size: 13px; margin: 0 0 6px; }
  .item .meta a { color: inherit; }
  .item p { margin: 0; }
</style>
</head>
<body>
<header>
  <p class="kicker">Hacker News 摘要</p>
  <h1>{{today}} · {{weekday}}</h1>
</header>

<section class="highlights">
  <h2>今日要点</h2>
  <ol>
    <li>一句话说今天讨论最热的一件事。</li>
    <li>第二件。</li>
    <li>第三件。</li>
  </ol>
</section>

<h2>AI</h2>
<article class="item">
  <h3><a href="https://example.com">English Title｜中文译名</a></h3>
  <p class="meta">▲ 512 分 · <a href="https://news.ycombinator.com/item?id=1">248 条评论</a> · 2026-11-05 08:12</p>
  <p>两句话：它是什么，为什么大家在讨论。</p>
</article>
</body>
</html>
